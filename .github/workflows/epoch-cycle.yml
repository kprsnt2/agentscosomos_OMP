name: Epoch Cycle

on:
  schedule:
    # Every 12 hours: midnight and noon UTC
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  run-epoch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger epoch cycle
        run: |
          # Strip trailing slashes
          URL="${{ secrets.SITE_URL }}"
          URL="${URL%/}"
          
          # Ensure https:// prefix if missing
          if [[ ! "$URL" =~ ^https?:// ]]; then
            URL="https://$URL"
          fi

          echo "Target: $URL/api/cycle"

          # Use -L to follow redirects (handles HTTP->HTTPS and trailing slash 308s)
          response=$(curl -s -L -o /tmp/cycle_response.json -w "%{http_code}" \
            -X POST "$URL/api/cycle" \
            -H "Authorization: Bearer ${{ secrets.CYCLE_SECRET }}" \
            -H "Content-Type: application/json")
          
          echo "Response code: $response"
          cat /tmp/cycle_response.json
          echo ""

          if [ "$response" != "200" ]; then
            echo "::error::Epoch cycle failed with status $response"
            exit 1
          fi
          
          echo "✅ Epoch cycle triggered successfully"
